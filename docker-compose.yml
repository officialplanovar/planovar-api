services:
  postgres:
    image: postgres:16-alpine
    container_name: planovar_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planovar_dev
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the `planovar_shadow` DB (needed by `prisma migrate dev`) on fresh volumes.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d planovar_dev']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: planovar_redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  typesense:
    image: typesense/typesense:26.0
    container_name: planovar_typesense
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: xyz
    ports:
      - '8108:8108'
    volumes:
      - typesensedata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  typesensedata:
