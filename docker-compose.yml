services:
  postgres:
    image: postgres:16-alpine
    container_name: planovar_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planovar_dev
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: planovar_redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    restart: unless-stopped

  typesense:
    image: typesense/typesense:26.0
    container_name: planovar_typesense
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: xyz
    ports:
      - '8108:8108'
    volumes:
      - typesensedata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  typesensedata:
